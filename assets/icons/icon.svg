<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Washing Machine Body -->
  <rect x="96" y="80" width="320" height="352" rx="36" fill="#ffffff" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.25))" />

  <!-- Top Control Panel -->
  <rect x="96" y="80" width="320" height="84" rx="36" fill="#f1f5f9" />
  <rect x="96" y="130" width="320" height="34" fill="#f1f5f9" />
  <line x1="96" y1="164" x2="416" y2="164" stroke="#e2e8f0" stroke-width="3" />

  <!-- Detergent Drawer & Knobs -->
  <rect x="128" y="104" width="70" height="36" rx="8" fill="#e2e8f0" />
  <rect x="140" y="118" width="46" height="8" rx="4" fill="#94a3b8" />
  
  <!-- Digital Display Screen -->
  <rect x="220" y="104" width="90" height="36" rx="8" fill="#0f172a" />
  <text x="265" y="128" font-family="sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle">CLEAN</text>

  <!-- Power Knob Button -->
  <circle cx="365" cy="122" r="18" fill="#0284c7" />
  <circle cx="365" cy="122" r="14" fill="#ffffff" />
  <circle cx="365" cy="122" r="6" fill="#0284c7" />

  <!-- Main Drum Glass Outer Ring -->
  <circle cx="256" cy="286" r="110" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4" />
  <circle cx="256" cy="286" r="92" fill="url(#drumGrad)" />

  <!-- Drum Window Glass & Water Swirl -->
  <circle cx="256" cy="286" r="82" fill="#0369a1" />
  <path d="M 174 286 Q 215 250, 256 286 T 338 286 A 82 82 0 0 1 174 286 Z" fill="url(#waterGrad)" />
  
  <!-- Sparkles & Bubbles -->
  <circle cx="220" cy="260" r="10" fill="#ffffff" opacity="0.85" />
  <circle cx="280" cy="315" r="14" fill="#ffffff" opacity="0.75" />
  <circle cx="240" cy="325" r="7" fill="#ffffff" opacity="0.8" />
  <circle cx="295" cy="255" r="8" fill="#ffffff" opacity="0.9" />

  <!-- Magic Sparkles Top Right -->
  <path d="M 390 60 L 398 80 L 418 88 L 398 96 L 390 116 L 382 96 L 362 88 L 382 80 Z" fill="#fef08a" filter="url(#glow)" />
  <path d="M 110 50 L 115 62 L 127 67 L 115 72 L 110 84 L 105 72 L 93 67 L 105 62 Z" fill="#fef08a" />
</svg>
